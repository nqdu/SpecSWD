PROJECT_NAME           = SpecSWD
PROJECT_BRIEF          = "Surface-wave dispersion and sensitivity kernels"
OUTPUT_DIRECTORY       = ./misc/doxygen

INPUT                  = ./include \
                         ./src/mesh \
                         ./src/shared \
                         ./src/vti \
                         ./src/aniso \
                         ./src/libswd
RECURSIVE              = YES
FILE_PATTERNS          = *.hpp *.h *.cpp
EXTRACT_ALL            = YES
EXTRACT_PRIVATE        = NO
FULL_PATH_NAMES        = NO
STRIP_FROM_PATH        = ./

GENERATE_HTML          = YES
HTML_OUTPUT            = html
HTML_FILE_EXTENSION    = .html
GENERATE_LATEX         = NO

QUIET                  = YES
WARN_IF_UNDOCUMENTED   = NO
WARN_IF_DOC_ERROR      = YES
WARN_LOGFILE           = ./misc/doxygen/warnings.log
