[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specd"
version = "0.4.0"
description = "Surface wave dispersion and sensitivity analysis in anisotropic, weakly anelastic medium"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.7"
license = { text = "MIT" }

authors = [
  { name = "Nanqiao Du", email = "nqdu@foxmail.com" }
]
dependencies = [
  "numpy>=1.20",
  "scipy>=1.12.0",
  "h5py>=3.11.0",
  "matplotlib>=3.5.0"
]

[project.optional-dependencies]
torch = ["torch>=2.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["specd", "specd.*"]
exclude = ["specd.torch.tests*", "specd.torch.benchmarks*"]

[tool.setuptools.package-data]
"specd.lib" = ["*.so", "*.pyd", "*.dylib"]

